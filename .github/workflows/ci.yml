name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight quality dependencies
        run: python -m pip install pyyaml ruff
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q physground eval scripts train.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the canonical manifest example
        run: python -m physground.validation examples/train_example.jsonl --config configs/qwen3vl_physground.yaml

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model runtime dependencies
        run: python -m pip install "transformers>=4.57,<6" "peft>=0.17" safetensors
      - name: Run architecture tests
        run: python -m unittest tests.test_modeling -v
