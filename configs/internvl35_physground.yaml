seed: 42

model:
  # Use the HF-format checkpoint for the unified Transformers multimodal API.
  id: OpenGVLab/InternVL3_5-8B-HF
  dtype: bf16
  trust_remote_code: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: all-linear

data:
  train_jsonl: data/train_physground.jsonl
  media_root: data
  num_frames: 16

grounding:
  lm_weight: 1.0
  hidden_dropout: 0.05
  pooling: prompt_end
  head_hidden_dim: 512
  jepa_weight: 0.0
  heads:
    - {name: moving, group: state, kind: classification, num_labels: 2, weight: 1.0}
    - {name: contact, group: state, kind: classification, num_labels: 2, weight: 1.0}
    - {name: mass_rank, group: property, kind: classification, num_labels: 3, weight: 1.0}
    - {name: contact_onset, group: delta, kind: classification, num_labels: 2, weight: 1.0}

training:
  output_dir: outputs/internvl35-8b-physground
  learning_rate: 2.0e-5
  num_train_epochs: 1
  gradient_accumulation_steps: 8
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  eval_strategy: "no"
  gradient_checkpointing: true
  bf16: true
  optim: adamw_torch_fused
  report_to: none
